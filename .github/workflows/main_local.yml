name: News Hunter Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "40 1 * * *"
    - cron: "40 4 * * *"
    - cron: "40 7 * * *"
    - cron: "40 11 * * *"
    - cron: "40 14 * * *"

permissions:
  contents: read

jobs:
  run-news-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:

      # ===================================================
      # CHECKOUT REPOSITORY
      # ===================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ===================================================
      # SETUP PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ===================================================
      # CACHE PLAYWRIGHT
      # ===================================================

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      # ===================================================
      # INSTALL DEPENDENCIES
      # ===================================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            feedparser \
            pandas \
            requests \
            python-dotenv \
            openai \
            trafilatura \
            beautifulsoup4 \
            lxml \
            playwright

      # ===================================================
      # INSTALL HUGGINGFACE IMAGE DEPENDENCIES
      # ===================================================

      - name: Install HuggingFace Image Dependencies
        run: |

          pip install pillow
          pip install huggingface_hub
      # ===================================================
      # INSTALL PLAYWRIGHT BROWSER
      # ===================================================

      - name: Install Playwright Chromium
        run: |

          playwright install chromium
          playwright install-deps

      # ===================================================
      # SHOW DEBUG INFO
      # ===================================================

      - name: Show Runtime Info
        run: |

          echo "========== PYTHON VERSION =========="
          python --version

          echo "========== CURRENT UTC TIME =========="
          date -u

          echo "========== PLAYWRIGHT VERSION =========="
          python -m playwright --version

      # ===================================================
      # RUN BOT
      # ===================================================

      - name: Run News Hunter Bot

        env:

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          CANVA_EMAIL: ${{ secrets.CANVA_EMAIL }}

          CANVA_PASSWORD: ${{ secrets.CANVA_PASSWORD }}

        run: |

          echo "🔥 STARTING NEWS HUNTER BOT"

          python news_hunter_local.py

      # ===================================================
      # UPLOAD CSV
      # ===================================================

      - name: Upload CSV Artifact

        uses: actions/upload-artifact@v4

        if: always()

        with:

          name: viral-news-results

          path: viral_reel_news.csv

          if-no-files-found: ignore
